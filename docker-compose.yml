services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
volumes:
  chat_data:
