services:
  - type: web
    name: lyftr-manav-api
    runtime: docker
    plan: starter
    rootDir: backend
    healthCheckPath: /health
    disk:
      name: lyftr-sqlite
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: lyftr-manav-chat
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lyftr-manav-chat
    runtime: static
    rootDir: frontend
    buildCommand: test -n "$VITE_API_BASE_URL" && npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: lyftr-manav-api
          envVarKey: RENDER_EXTERNAL_URL
